[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lactransformer"
dynamic = ["version"]
description = "LAS & Co Transformer — convert WGS84, ETRS89, Hungarian EOV and SVY21 projections from/to LiDAR LAS, trajectory CSV, TerraPhoto Image List, Riegl Camera CSV and PEF formats."
license = { text = "MPL-2.0" }
authors = [{ name = "Kalman Szalai - KAMI", email = "kami911@gmail.com" }]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["gis", "lidar", "las", "eov", "vitel", "vitel2009", "vitel2014"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.23.4",
    "pandas>=1.5.0",
    "pyproj>=3.3.1",
    "laspy[lazrs]>=2.5.0",
]

[project.optional-dependencies]
gui = ["wxPython>=4.0"]
dev = ["ruff", "bandit", "pip-audit", "coverage"]

[project.urls]
Homepage = "https://github.com/KAMI911/lactransformer"

[project.scripts]
lactransformer = "lactransformer.lactransformer:main"
lasdiff = "lactransformer.lasdiff:main"
gtx_ascii2bin = "lactransformer.gtx_ascii2bin:main"
gtx_bin2ascii = "lactransformer.gtx_bin2ascii:main"

[tool.setuptools.dynamic]
version = { attr = "lactransformer.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["lactransformer*"]

[tool.setuptools.package-data]
"lactransformer" = ["grid/*.gsb", "grid/*.gtx"]

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["lactransformer/grid"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"test_lactransformer.py" = ["S101"]
